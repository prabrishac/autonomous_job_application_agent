[project]
name = "autonomous-job-application-agent"
version = "0.1.0"
description = "Autonomous agent that tailors resumes, writes cover letters, and preps interview answers for a given job description."
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
job-agent = "autonomous_job_application_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []
